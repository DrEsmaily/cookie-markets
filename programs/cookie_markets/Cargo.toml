[package]
name = "cookie-markets"
version = "0.1.0"
description = "CookieMarkets prediction market protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cookie_markets"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.1.2", features = ["token"] }
