name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify preparation HTTP guards
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          FRONTEND_PID=$!
          trap 'kill "$FRONTEND_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001 >/dev/null; then break; fi
            sleep 1
          done
          npm run test:http

  program:
    name: Anchor program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace

  sbf:
    name: Deploy-target SBF build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Agave compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 300 \
            https://github.com/anza-xyz/agave/releases/download/v4.2.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
            --output "$RUNNER_TEMP/agave.tar.bz2"
          mkdir -p "$RUNNER_TEMP/agave"
          tar -xjf "$RUNNER_TEMP/agave.tar.bz2" -C "$RUNNER_TEMP/agave"
          echo "$RUNNER_TEMP/agave/solana-release/bin" >> "$GITHUB_PATH"
      - name: Compile deployable program
        run: cargo build-sbf --manifest-path programs/cookie_markets/Cargo.toml -- --locked
      - name: Publish program binary only
        uses: actions/upload-artifact@v4
        with:
          name: cookie-markets-sbf
          path: target/deploy/cookie_markets.so
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run local-validator transactions
        shell: bash
        run: |
          set -euo pipefail
          solana-test-validator --reset --ledger "$RUNNER_TEMP/test-ledger" \
            --bpf-program BNqof3tMVwNd7rthycJTtXkvbGtopihvL9gpeoSk8WaR target/deploy/cookie_markets.so \
            > "$RUNNER_TEMP/validator.log" 2>&1 &
          VALIDATOR_PID=$!
          trap 'kill "$VALIDATOR_PID" || true' EXIT
          for attempt in $(seq 1 60); do
            if solana --url http://127.0.0.1:8899 cluster-version >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm test
          node tests/program-transactions.cjs
